<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F8FB" />
    <title>Magica Tracker</title>
    <script>
      // The saved theme's palette, set before the first paint so a dark theme
      // never flashes light. src/ui/themes.ts owns the choice and re-applies it;
      // with nothing saved, this mirrors its default: Euphie, following the system.
      try {
        var t = JSON.parse(localStorage.getItem('magica:v1:theme') || 'null') || {};
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = t.appearance === 'light' || t.appearance === 'dark' ? t.appearance : dark ? 'dark' : 'light';
        var p = t[mode] || 'euphie-' + mode;
        if (/^[a-z0-9-]+$/.test(p)) document.documentElement.dataset.palette = p;
      } catch (e) {}
    </script>
    <!-- Inline icon so the browser never goes looking for /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%231A3550' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%237F77DD'/%3E%3Ccircle cx='24.5' cy='8' r='2.5' fill='%23F0C060'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Magica Tracker needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
